services:
    web:
        environment:
            BFF_COOKIE_SECURE: 'false'
            BFF_TRUST_PROXY_HEADERS: 'true'

    e2e:
        image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:?}-noble
        init: true
        working_dir: ${WORKSPACE_ROOT:?}/apps/web/tests
        volumes: ['${WORKSPACE_ROOT:?}:${WORKSPACE_ROOT:?}']
        environment:
            API_BASE_URL: http://api:${API_PORT:?}
            WEB_BASE_URL: http://web.localhost:${WEB_PORT:?}
            S3_ENDPOINT: ${S3_ENDPOINT:?}
            S3_BUCKET: ${S3_BUCKET:?}
            WORKSPACE_ROOT: ${WORKSPACE_ROOT:?}
        entrypoint: ['${WORKSPACE_ROOT:?}/apps/web/node_modules/.bin/playwright', 'test']
