services:
    api:
        build:
            context: ${WORKSPACE_ROOT:?}
            dockerfile: apps/api/Dockerfile
        env_file:
            - path: ${WORKSPACE_ROOT:?}/.env.infra
              format: raw
            - path: ${WORKSPACE_ROOT:?}/.env.api
              format: raw
        environment:
            NODE_ENV: production
        logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
        healthcheck:
            test: 'curl -fsS http://localhost:$${API_PORT:?}/health'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

networks:
    default:
        name: ${DEVCONTAINER_NETWORK:?}
        external: true
