services:
    api:
        build:
            context: ${WORKSPACE_ROOT:?}
            dockerfile: apps/api/Dockerfile
        env_file:
            - path: ${WORKSPACE_ROOT:?}/.env.infra
              format: raw
            - path: ${WORKSPACE_ROOT:?}/.env.api
              format: raw
        environment:
            NODE_ENV: production
            RESTATE_DEPLOYMENT_URI: http://api:${RESTATE_SERVICE_PORT:?}
        logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
        healthcheck:
            test: 'curl -fsS http://localhost:$${API_PORT:?}/health'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    test-api-docs:
        extends: api
        profiles: [test]
        hostname: test-api-docs
        pull_policy: build
        build:
            target: api-docs
        init: true
        environment:
            PROJECT_ID: ${PROJECT_ID:?}-docs
            RESTATE_DEPLOYMENT_URI: http://test-api-docs:${RESTATE_SERVICE_PORT:?}
            SERVER_URL: http://localhost:${API_PORT:?}
            LOG_CONSOLE_LEVEL: error
        entrypoint:
            - sh
            - -ec
            - |
                npm start &
                curl -fsS --retry 10 --retry-delay 1 --retry-connrefused "$$SERVER_URL/health" >/dev/null
                exec bash /api-docs/run.sh "$$@"
            - sh

networks:
    default:
        name: ${DEVCONTAINER_NETWORK:?}
        external: true
