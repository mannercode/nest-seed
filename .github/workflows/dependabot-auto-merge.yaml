# Dependabot PR의 Test AtoZ가 성공하면, 그 실행이 검증한 head commit을 직접 squash merge한다.
# workflow_run은 기본 브랜치의 이 파일을 사용하며 PR 코드를 실행하지 않는다.
name: Dependabot Auto Merge
on:
    workflow_run:
        workflows: ['Test AtoZ']
        types: [completed]
permissions:
    contents: write
    pull-requests: write
jobs:
    auto-merge:
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'pull_request' &&
            github.event.workflow_run.actor.login == 'dependabot[bot]' &&
            github.event.workflow_run.pull_requests[0].base.ref == 'main'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Merge the tested Dependabot commit
              run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$PR_HEAD_SHA"
              env:
                  PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
                  PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
                  GH_TOKEN: ${{ github.token }}
