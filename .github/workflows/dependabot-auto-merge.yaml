# `--auto` 머지는 main 룰셋의 필수 검사(test-atoz)가 통과할 때까지 기다린다.
# fork에서 다시 켜야 하는 룰셋·자동 병합·보안 설정 절차는 docs/github-setup.md의 3·4절을 따른다.
name: Dependabot Auto Merge
on:
    pull_request:
        branches: ['main']
# dependabot이 트리거한 실행의 GITHUB_TOKEN은 기본 읽기 전용이라 머지 권한을 명시한다.
permissions:
    contents: write
    pull-requests: write
jobs:
    auto-merge:
        if: github.actor == 'dependabot[bot]'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Read Dependabot update metadata
              id: metadata
              uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
            - name: Enable auto-merge for non-major updates
              if: steps.metadata.outputs.update-type != 'version-update:semver-major'
              run: gh pr merge --auto --squash "$PR_URL"
              env:
                  PR_URL: ${{ github.event.pull_request.html_url }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
