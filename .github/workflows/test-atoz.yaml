name: Test AtoZ
on:
    pull_request:
        branches: ['main']
    push:
        branches: ['main']
    workflow_dispatch:
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    test-atoz:
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Run in devcontainer
              uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
              env:
                  MONGO_DIAGNOSTICS_ON_TEST_FAILURE: 'true'
              with:
                  configFile: .devcontainer/devcontainer.json
                  push: never
                  env: |
                      MONGO_DIAGNOSTICS_ON_TEST_FAILURE
                  runCmd: |
                      set -Eeuo pipefail
                      git diff --exit-code -- package-lock.json
                      bash .github/scripts/run-with-ci-diagnostics.sh npm run atoz
                      git diff --exit-code -- package-lock.json
            - name: Upload test diagnostics
              if: ${{ always() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: atoz-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      tests/console-e2e/_output/
                      _output/ci-diagnostics/
                      _output/deploy-diagnostics/
                  if-no-files-found: warn
                  retention-days: 14
