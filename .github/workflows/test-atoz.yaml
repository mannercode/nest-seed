name: Test AtoZ
on:
    pull_request:
        branches: ['main']
    push:
        branches: ['main']
    schedule:
        # UTC 기준 3시간마다 실행한다.
        - cron: '27 */3 * * *'
    workflow_dispatch:
jobs:
    test-atoz:
        runs-on: ubuntu-24.04-arm
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Run in devcontainer
              uses: devcontainers/ci@v0.3.1900000450
              with:
                  runCmd: pnpm run atoz
