name: Test Stability
on:
    workflow_dispatch:
    schedule:
        # UTC 기준 6시간마다 실행한다.
        - cron: '27 */6 * * *'
permissions:
    contents: read
jobs:
    stability:
        name: ${{ matrix.name }}
        timeout-minutes: 240
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: libs
                      repeat: 38
                      group: bash infra/test.sh --
                      command: pnpm --recursive --filter "./libs/**" --fail-if-no-match run test --coverage.enabled=false
                    - name: api
                      repeat: 30
                      group: bash infra/test.sh --
                      setup: pnpm run pretest
                      command: |
                          pnpm --dir apps/api run test:vitest --coverage.enabled=false
                          pnpm --dir apps/api run test:api-docs
                    - name: infra-reset
                      repeat: 25
                      command: pnpm -C infra run reset
        runs-on: ubuntu-26.04-arm
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Run in devcontainer
              uses: devcontainers/ci@v0.3.1900000450
              with:
                  push: never
                  runCmd: |
                      set -e
                      ${{ matrix.setup }}
                      ${{ matrix.group }} bash -ec '
                          for ((run = 1; run <= ${{ matrix.repeat }}; run++)); do
                              echo "[Run ${run}/${{ matrix.repeat }}]"
                              ${{ matrix.command }}
                          done
                      '
