name: Test Stability
on:
    workflow_dispatch:
    schedule:
        # UTC 기준 매주 일요일 03:27에 실행한다.
        - cron: '27 3 * * 0'
permissions:
    contents: read
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    # 정기·수동 실행이 겹쳐도 진행 중인 표본을 버리지 않고 다음 실행을 대기시킨다.
    cancel-in-progress: false
jobs:
    stability:
        # 원본 저장소의 불변 ID다. fork에 맞출 때도 이 보호 조건의 의미는 유지한다.
        if: ${{ github.event_name != 'schedule' || github.repository_id == '849585972' || vars.ENABLE_SCHEDULED_CI == 'true' }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - leg: unit-libs
                      timeout: 30
                      run: |
                          npm run build
                          bash .github/scripts/repeat.sh 5 npm test -w libs -- --coverageThreshold='{}'
                    - leg: unit-api
                      timeout: 60
                      run: |
                          npm run build
                          bash .github/scripts/repeat.sh 5 npm test -w apps/api -- --coverage=false --coverageThreshold='{}'
                    - leg: bootup
                      timeout: 30
                      run: |
                          npm run build
                          bash .github/scripts/repeat.sh 10 bash infra/reset.sh
                    # 각 race는 동시 요청 수를 유지하되 자체 INNER_ITERATIONS와 workflow 반복이
                    # 곱해지지 않도록 회차당 inner batch 하나만 실행한다.
                    - leg: sse-fanout-race
                      timeout: 60
                      prebuild_deploy: true
                      run: INNER_ITERATIONS=1 bash .github/scripts/repeat.sh 5 bash tests/api-race/runner.sh sse-fanout-race
                    - leg: user-signup-race
                      timeout: 60
                      prebuild_deploy: true
                      run: INNER_ITERATIONS=1 bash .github/scripts/repeat.sh 5 bash tests/api-race/runner.sh user-signup-race
                    - leg: ticket-holding-race
                      timeout: 60
                      prebuild_deploy: true
                      run: INNER_ITERATIONS=1 bash .github/scripts/repeat.sh 5 bash tests/api-race/runner.sh ticket-holding-race
                    - leg: showtime-overlap-race
                      timeout: 60
                      prebuild_deploy: true
                      run: INNER_ITERATIONS=1 bash .github/scripts/repeat.sh 5 bash tests/api-race/runner.sh showtime-overlap-race
                    - leg: purchase-double-spend
                      timeout: 60
                      prebuild_deploy: true
                      run: INNER_ITERATIONS=1 bash .github/scripts/repeat.sh 5 bash tests/api-race/runner.sh purchase-double-spend
                    - leg: purchase-overlap-race
                      timeout: 60
                      prebuild_deploy: true
                      run: INNER_ITERATIONS=1 bash .github/scripts/repeat.sh 5 bash tests/api-race/runner.sh purchase-overlap-race
                    - leg: replica-chaos
                      timeout: 30
                      prebuild_deploy: true
                      run: bash .github/scripts/repeat.sh 3 bash tests/api-race/runner.sh replica-chaos
                    - leg: jwt-refresh-race
                      timeout: 60
                      prebuild_deploy: true
                      run: INNER_ITERATIONS=1 bash .github/scripts/repeat.sh 5 bash tests/api-race/runner.sh jwt-refresh-race
        runs-on: ubuntu-24.04-arm
        timeout-minutes: ${{ matrix.timeout }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Login to Docker Hub (host)
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
            - name: Run in devcontainer
              uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                  MONGO_DIAGNOSTICS_ON_TEST_FAILURE: 'true'
              with:
                  configFile: .devcontainer/devcontainer.json
                  push: never
                  env: |
                      DOCKERHUB_USERNAME
                      DOCKERHUB_TOKEN
                      MONGO_DIAGNOSTICS_ON_TEST_FAILURE
                  runCmd: |
                      set -Eeuo pipefail
                      git diff --exit-code -- package-lock.json
                      echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
                      if [ "${{ matrix.prebuild_deploy }}" = "true" ]; then
                          bash deploy/prebuild-images.sh
                          export DEPLOY_IMAGES_PREBUILT=true
                      fi
                      ${{ matrix.run }}
                      git diff --exit-code -- package-lock.json
