name: Test Stability
on:
    workflow_dispatch:
    schedule:
        # UTC 기준 6시간마다 실행한다.
        - cron: '27 */6 * * *'
permissions:
    contents: read
jobs:
    stability:
        name: atoz (${{ matrix.batch }}/5)
        timeout-minutes: 240
        strategy:
            fail-fast: false
            matrix:
                batch: [1, 2, 3, 4, 5]
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v7.0.1
            - name: Run in devcontainer
              uses: devcontainers/ci@v0.3.1900000450
              with:
                  runCmd: |
                      set -e
                      run=1
                      while [ "$run" -le 10 ]; do
                          echo "[Run ${run}/10]"
                          pnpm run atoz
                          run=$((run + 1))
                      done
