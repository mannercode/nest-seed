# registry에서 직접 설치하는 dependencies/devDependencies는 정확 고정한다.
# peerDependencies의 호환 범위와 로컬 workspace 연결(`*`)은 예외이며, 고정 버전은 갱신 장치가 없으면 포크 시점부터 묵기 시작한다.
# npm, GitHub Actions, Docker 이미지의 minor/patch만 주 1회 확인한다. major는 서로 맞물린
# toolchain/runtime을 한 PR에서 올려야 하므로 routine version update 대상에서 제외한다.
# npm은 manifest에 명시한 직접 의존성만 갱신 후보로 삼고, 실제로 같은 release train을
# 따르는 생태계만 묶는다. lockfile 간접 의존성 전체를 한 PR로 묶으면 무관한 변경 하나가
# 모든 안전한 갱신을 막고 install-script 심사 범위도 불필요하게 커진다.
# `allow.update-types`는 security update에는 적용되지 않아 major 보안 수정 PR도 계속 열린다.
# 올라온 PR은 기존 test-atoz 워크플로(pull_request 트리거)가 그대로 검증한다.
version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      allow:
          - dependency-type: direct
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
      groups:
          aws-sdk-minor-patch:
              patterns: ['@aws-sdk/*']
              update-types: ['minor', 'patch']
          next-minor-patch:
              patterns: ['next', 'eslint-config-next']
              update-types: ['minor', 'patch']
          nestjs-minor-patch:
              patterns: ['@nestjs/*']
              update-types: ['minor', 'patch']
          restate-minor-patch:
              patterns: ['@restatedev/*']
              update-types: ['minor', 'patch']
          react-minor-patch:
              patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
              update-types: ['minor', 'patch']
          eslint-minor-patch:
              patterns:
                  ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*']
              update-types: ['minor', 'patch']
          commitlint-minor-patch:
              patterns: ['@commitlint/*']
              update-types: ['minor', 'patch']
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
      allow:
          - dependency-type: direct
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
      groups:
          actions-minor-patch:
              patterns: ['*']
              update-types: ['minor', 'patch']
    # 세 Dockerfile의 첫 외부 FROM을 같은 Node 이미지로 유지한다. dependency-name 기준
    # cross-directory grouping으로 tag+digest 갱신도 항상 하나의 PR에서 수행한다.
    - package-ecosystem: docker
      directories:
          - '/.devcontainer'
          - '/apps/api'
          - '/deploy'
      schedule:
          interval: weekly
      allow:
          - dependency-type: direct
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
      groups:
          docker-minor-patch:
              group-by: dependency-name
              patterns: ['*']
              update-types: ['minor', 'patch']
    # Compose updater는 리터럴 image 참조만 갱신한다. .env.infra의 *_IMAGE 변수는
    # updater가 해석하지 않으므로 해당 digest는 인프라 이미지 갱신 시 수동 검증한다.
    - package-ecosystem: docker-compose
      directories:
          - '/deploy'
          - '/infra'
      schedule:
          interval: weekly
      allow:
          - dependency-type: direct
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
      groups:
          compose-minor-patch:
              group-by: dependency-name
              patterns: ['*']
              update-types: ['minor', 'patch']
