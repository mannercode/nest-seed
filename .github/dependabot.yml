# registry에서 직접 설치하는 dependencies/devDependencies는 버전을 정확히 지정한다.
# peerDependencies의 호환 범위와 로컬 workspace 연결(`workspace:*`)은 예외다.
# 고정한 버전도 계속 갱신하도록 npm 패키지, GitHub Actions, Docker 이미지의 minor/patch를 주 1회 확인한다.
# major 갱신은 관련 빌드 도구와 런타임을 한 PR에서 함께 검토해야 하므로 정기 갱신 대상에서 제외한다.
# npm 패키지는 manifest에 명시한 직접 의존성만 갱신하며, 함께 버전을 올려야 하는 패키지만 묶는다.
# 관련 없는 간접 의존성까지 한 PR에 묶으면 하나의 실패가 나머지 갱신을 막고 설치 스크립트 검토 범위도 커진다.
# `allow.update-types`는 보안 갱신에는 적용되지 않아 major 보안 수정 PR도 생성된다.
# test-atoz가 PR을 검증하면 후속 workflow가 검사를 통과한 커밋과 PR의 최신 커밋이 같은지 확인한 뒤 자동 병합한다.
version: 2
updates:
    - package-ecosystem: npm
      directory: '/'
      schedule:
          interval: weekly
      allow:
          - dependency-type: direct
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
      # TypeScript는 별도 지시 전까지 patch를 포함한 모든 업데이트에서 제외한다.
      ignore:
          - dependency-name: typescript
      groups:
          aws-sdk-minor-patch:
              patterns: ['@aws-sdk/*']
              update-types: ['minor', 'patch']
          next-minor-patch:
              patterns: ['next']
              update-types: ['minor', 'patch']
          nestjs-minor-patch:
              patterns: ['@nestjs/*']
              update-types: ['minor', 'patch']
          restate-minor-patch:
              patterns: ['@restatedev/*']
              update-types: ['minor', 'patch']
          react-minor-patch:
              patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
              update-types: ['minor', 'patch']
          commitlint-minor-patch:
              patterns: ['@commitlint/*']
              update-types: ['minor', 'patch']
    - package-ecosystem: github-actions
      directory: '/'
      schedule:
          interval: weekly
      allow:
          - dependency-type: direct
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
      groups:
          actions-minor-patch:
              patterns: ['*']
              update-types: ['minor', 'patch']
    # Dev Container와 앱들의 Node 이미지는 patch·배포판·digest까지 동일하게 고정한다.
    # dependency-name 기준 cross-directory grouping으로 tag+digest 갱신도 한 PR에서 수행한다.
    - package-ecosystem: docker
      directories:
          - '/.devcontainer'
          - '/apps/api'
          - '/apps/console'
          - '/apps/user-app'
      schedule:
          interval: weekly
      allow:
          - dependency-type: direct
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
      groups:
          docker-minor-patch:
              group-by: dependency-name
              patterns: ['*']
              update-types: ['minor', 'patch']
    # Compose updater는 리터럴 image 참조만 갱신한다. .env.infra의 *_IMAGE 변수는
    # updater가 해석하지 않으므로 해당 digest는 인프라 이미지 갱신 시 수동 검증한다.
    - package-ecosystem: docker-compose
      directories:
          - '/tests/api'
          - '/infra'
          - '/tests/web'
          - '/tools'
      schedule:
          interval: weekly
      allow:
          - dependency-type: direct
            update-types:
                - version-update:semver-minor
                - version-update:semver-patch
      groups:
          compose-minor-patch:
              group-by: dependency-name
              patterns: ['*']
              update-types: ['minor', 'patch']
