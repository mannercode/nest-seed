services:
    api:
        build:
            context: ${WORKSPACE_ROOT:?}
            dockerfile: apps/api/Dockerfile
        env_file:
            - path: ${WORKSPACE_ROOT:?}/.env.infra
              format: raw
            - path: ${WORKSPACE_ROOT:?}/.env.api
              format: raw
        environment:
            NODE_ENV: production
            PROJECT_ID: ${PROJECT_ID:?}
            RESTATE_DEPLOYMENT_URI: http://api:${RESTATE_SERVICE_PORT:?}
        logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
        healthcheck:
            test: 'curl -fsS http://localhost:$${API_PORT:?}/health'
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    web:
        build:
            context: ${WORKSPACE_ROOT:?}
            dockerfile: apps/web/Dockerfile
        environment:
            API_BASE_URL: http://api:${API_PORT:?}
            S3_ENDPOINT: ${S3_ENDPOINT:?}
            PORT: ${WEB_PORT:?}
        depends_on:
            api: { condition: service_healthy }
        logging: { driver: json-file, options: { max-size: '1m', max-file: '1' } }
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:'+process.env.PORT).then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 2s
            timeout: 5s
            retries: 60
            start_period: 5s

    replica-api:
        extends: api
        profiles: [replicas]
        image: nest-seed-api
        environment:
            RESTATE_DEPLOYMENT_URI: http://replica-nginx:9080
            # 비밀번호 해싱과 파일 작업이 같은 작업 스레드를 사용하므로 동시 요청을 위해 16개로 늘린다.
            UV_THREADPOOL_SIZE: '16'
        deploy: { replicas: 4 }

    nginx:
        profiles: [replicas]
        hostname: replica-nginx
        image: nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
        ports: ['127.0.0.1:3000:80']
        volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
        depends_on:
            replica-api: { condition: service_started }
        logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
        healthcheck:
            # NGINX는 IPv4를 수신하고 Alpine의 localhost는 ::1로 먼저 해석된다.
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health >/dev/null']
            interval: 5s
            timeout: 3s
        restart: unless-stopped

networks:
    default:
        name: ${DEVCONTAINER_NETWORK:?}
        external: true
