name: ${COMPOSE_PROJECT_NAME:?}

include:
    - ./compose.mongo.yml
    - ./compose.s3.yml
    - ./compose.redis.yml
    - ./compose.nats.yml
    - ./compose.restate.yml

services:
    # 모든 setup 서비스가 성공한 뒤 종료되는 기준 컨테이너다.
    # `reset.sh`는 이 컨테이너의 종료를 보고 인프라 준비 완료 시점을 판단한 뒤, 종료된 setup 컨테이너를 정리한다.
    infra-setup:
        extends: { file: ./compose.common.yml, service: common-options }
        image: alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
        depends_on:
            mongo-setup: { condition: service_completed_successfully }
            redis-setup: { condition: service_completed_successfully }
            s3-setup: { condition: service_completed_successfully }
            restate: { condition: service_healthy }
            nats: { condition: service_healthy }
        command: ['true']

# Dev Container가 워크스페이스 이름으로 만든 네트워크에서 앱과 인프라가 서비스 이름으로 통신한다.
networks:
    default:
        name: ${COMPOSE_PROJECT_NAME:?}
        external: true
