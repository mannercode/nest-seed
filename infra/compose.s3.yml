services:
    s3:
        extends: { file: ./compose.common.yml, service: common-options }
        image: ${S3_IMAGE}
        # 앱과 테스트는 compose 네트워크 안에서 S3 API(7070)에 접근한다.
        # VersityGW의 Admin API와 WebUI는 활성화하지 않고, host port도 publish하지 않는다.
        environment:
            # 필수 환경 변수가 없으면 :?로 Compose 실행을 중단한다.
            # 빈 값으로 시작한 뒤 원인을 'S3 unhealthy'로 잘못 판단하지 않도록 한다.
            ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
            ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
            VGW_REGION: ${S3_REGION:?}
            VGW_PORT: ':7070'
            VGW_HEALTH: /_/health
            VGW_BACKEND: posix
            VGW_BACKEND_ARGS: /data
        volumes:
            - s3_data:/data
        healthcheck:
            # VersityGW health endpoint는 GET만 받으므로 wget의 HEAD 기반 --spider를 쓰지 않는다.
            test: 'wget -q -O /dev/null http://localhost:7070/_/health'

    s3-setup:
        extends: { file: ./compose.common.yml, service: common-options }
        image: amazon/aws-cli:2.37.6@sha256:82905aa8fdab6e2403b40dceec12dc33aea2535a4c2a6f13d596d98501951105
        depends_on:
            s3:
                condition: service_healthy
        entrypoint: /bin/sh
        command: >
            -c "
            aws --endpoint-url http://s3:7070 s3 mb s3://${S3_BUCKET:?} ||
            aws --endpoint-url http://s3:7070 s3 ls s3://${S3_BUCKET}
            "
        environment:
            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
            AWS_DEFAULT_REGION: ${S3_REGION:?}
            AWS_EC2_METADATA_DISABLED: 'true'
            S3_BUCKET: ${S3_BUCKET:?}

volumes:
    s3_data:
