x-redis-base: &redis-base
    extends: { file: ./compose.common.yml, service: common-options }
    image: $REDIS_IMAGE
    healthcheck:
        test: 'redis-cli -p "$$REDIS_PORT" ping | grep -qx PONG'
    # 클라이언트가 클러스터를 탐색할 때 각 노드의 Docker 호스트명과 실제 수신 포트로 접속한다.
    command: |
        sh -euc '
          exec redis-server --port "$$REDIS_PORT" \
          --cluster-enabled yes \
          --cluster-config-file nodes.conf \
          --cluster-announce-hostname "$$HOSTNAME" \
          --cluster-preferred-endpoint-type hostname \
          --cluster-require-full-coverage no \
          --protected-mode no
        '

services:
    redis1:
        <<: *redis-base
        hostname: ${REDIS_HOST1:?}
        environment:
            REDIS_PORT: ${REDIS_PORT1:?}

    redis2:
        <<: *redis-base
        hostname: ${REDIS_HOST2:?}
        environment:
            REDIS_PORT: ${REDIS_PORT2:?}

    redis3:
        <<: *redis-base
        hostname: ${REDIS_HOST3:?}
        environment:
            REDIS_PORT: ${REDIS_PORT3:?}

    redis-setup:
        extends: { file: ./compose.common.yml, service: common-options }
        image: $REDIS_IMAGE
        depends_on:
            {
                redis1: { condition: service_healthy },
                redis2: { condition: service_healthy },
                redis3: { condition: service_healthy }
            }
        command:
            - sh
            - -euc
            - |
                redis-cli --cluster create "$$@" --cluster-replicas 0 --cluster-yes
                deadline=$$(( $$(date +%s) + 60 ))
                for node do
                    until redis-cli -e -h "$${node%:*}" -p "$${node##*:}" cluster info | grep -qx 'cluster_state:ok[[:space:]]*'; do
                        if [ "$$(date +%s)" -ge "$$deadline" ]; then
                            echo "Redis cluster did not become ready on $$node" >&2
                            exit 1
                        fi
                        sleep 1
                    done
                done
            - redis-setup
            - ${REDIS_HOST1:?}:${REDIS_PORT1:?}
            - ${REDIS_HOST2:?}:${REDIS_PORT2:?}
            - ${REDIS_HOST3:?}:${REDIS_PORT3:?}
