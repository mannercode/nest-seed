limit.maxIDLength:
    - value: 255
      constraints: {}
system.forceSearchAttributesCacheRefreshOnRead:
    - value: true # 개발 환경 전용이므로 운영 환경에서는 활성화하지 말 것.
      constraints: {}
# dev/test 네임스페이스는 1h 미만 보존을 쓰기 위해 최소 보존일을 0으로 푼다.
# 운영 클러스터에서는 기본값(1일) 또는 그 이상을 유지해야 한다.
system.minRetentionDays:
    - value: 0
      constraints: {}
# 단일 노드 테스트 환경에서는 큰 poll/batch가 SQL 작업을 순간적으로 몰아
# `TransferActivityTask`와 트랜잭션 시작 제한 시간을 함께 소진할 수 있다.
# 서버 버전이 바뀌어도 검증 부하가 흔들리지 않도록 보수적인 기본값을 명시한다.
history.transferProcessorMaxPollRPS:
    - value: 20
      constraints: {}
history.transferTaskBatchSize:
    - value: 100
      constraints: {}
