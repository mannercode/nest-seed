services:
    api:
        extends:
            file: ${WORKSPACE_ROOT:?}/apps/api/compose.yml
            service: api

    web:
        build:
            context: ${WORKSPACE_ROOT:?}
            dockerfile: apps/web/Dockerfile
        environment:
            API_BASE_URL: http://api:${API_PORT:?}
            S3_ENDPOINT: ${S3_ENDPOINT:?}
            BFF_COOKIE_SECURE: 'false'
            BFF_TRUST_PROXY_HEADERS: 'true'
            PORT: ${WEB_PORT:?}
        depends_on:
            api: { condition: service_healthy }
        logging: { driver: json-file, options: { max-size: '1m', max-file: '1' } }
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://localhost:'+process.env.PORT).then(response=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
                ]
            interval: 2s
            timeout: 5s
            retries: 60
            start_period: 5s

networks:
    default:
        name: ${DEVCONTAINER_NETWORK:?}
        external: true
