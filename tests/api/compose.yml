services:
    api:
        extends:
            file: ${WORKSPACE_ROOT:?}/apps/api/compose.yml
            service: api
        image: nest-seed-api
        environment:
            - PROJECT_ID=${PROJECT_ID:?}-replicas
            - RESTATE_DEPLOYMENT_URI=http://replica-nginx:9080
            # 비밀번호 해싱과 파일 작업은 같은 작업 스레드를 사용한다.
            # 기본 4개로는 요청이 몰릴 때 부족하므로 16개로 늘린다.
            - UV_THREADPOOL_SIZE=16
        networks:
            default: { aliases: [replica-api] }
        # restart 정책은 일부러 두지 않는다.
        # 이 스택은 검증용이라, 복제본이 죽으면 자동 복구로 가려지지 않고 그대로 드러나야 한다.
        # replica-chaos 시나리오도 kill/start로 복제본 생명주기를 직접 다루므로 자동 재시작과 충돌한다.
        deploy:
            replicas: 4

    nginx:
        hostname: replica-nginx
        image: nginx:1.31.9-alpine@sha256:fb4658584bd9a916ffb6f6e365f97c25cfdb2923801f551ea08356e695f14ff7
        ports: ['127.0.0.1:3000:80']
        volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
        depends_on:
            api: { condition: service_started }
        logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
        healthcheck:
            # Alpine은 localhost를 ::1로 먼저 해석하지만 이 검증용 NGINX는 IPv4만 listen한다.
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health >/dev/null']
            interval: 5s
            timeout: 3s
        restart: unless-stopped

networks:
    default:
        name: ${COMPOSE_PROJECT_NAME}
        external: true
