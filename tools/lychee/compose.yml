services:
    lychee:
        image: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
        network_mode: none
        working_dir: /workspace
        volumes:
            - ${WORKSPACE_ROOT:?}:/workspace
        command:
            - --offline
            - --include-fragments
            - '*.md'
            - '.devcontainer/README.md'
            - 'apps/api/README.md'
            - 'infra/README.md'
            - 'libs/README.md'
            - 'tests/README.md'
            - 'tools/README.md'
