services:
    lychee:
        profiles: [lint]
        image: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
        working_dir: /workspace
        volumes:
            - ${WORKSPACE_ROOT:?}:/workspace
        # 현재 가이드를 검사한다. 할 일 문서는 제외한다.
        command:
            - --offline
            - --include-fragments
            - '*.md'
            - '.devcontainer/README.md'
            - 'apps/README.md'
            - 'apps/api/README.md'
            - 'infra/README.md'
            - 'libs/README.md'
            - 'tests/README.md'
            - 'tools/README.md'

    k6:
        profiles: [benchmark]
        image: grafana/k6:2.4.0@sha256:d41bb79cd8de5a7ad619b53570e3712633e8bff0937010a5c6c57a4747e7a276
        working_dir: ${WORKSPACE_ROOT:?}
        environment:
            WORKSPACE_ROOT: ${WORKSPACE_ROOT:?}
        volumes: ['${WORKSPACE_ROOT:?}:${WORKSPACE_ROOT:?}']

networks:
    default:
        name: ${DEVCONTAINER_NETWORK:?}
        external: true
