services:
    lychee:
        profiles: [lint]
        image: lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d
        working_dir: /workspace
        volumes:
            - ${WORKSPACE_ROOT:?}:/workspace
        # 현재 가이드를 검사한다. 할 일 문서와 과거 원문의 옛 링크는 제외한다.
        command:
            - --offline
            - --include-fragments
            - --exclude-path
            - 'docs/backup/(before-reduction/|recovered/2026-)'
            - '*.md'
            - 'docs/**/*.md'

    k6:
        profiles: [benchmark]
        image: grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34
        working_dir: ${WORKSPACE_ROOT:?}
        environment:
            WORKSPACE_ROOT: ${WORKSPACE_ROOT:?}
        volumes: ['${WORKSPACE_ROOT:?}:${WORKSPACE_ROOT:?}']

networks:
    default:
        name: ${DEVCONTAINER_NETWORK:?}
        external: true
