services:
    lychee:
        profiles: [lint]
        image: lycheeverse/lychee:latest
        working_dir: /workspace
        volumes:
            - ${WORKSPACE_ROOT:?}:/workspace
        # 현재 가이드를 검사한다. 할 일 문서와 과거 원문의 옛 링크는 제외한다.
        command:
            - --offline
            - --include-fragments
            - --exclude-path
            - 'docs/backup/(before-reduction/|recovered/2026-)'
            - '*.md'
            - 'docs/**/*.md'

    k6:
        profiles: [benchmark]
        image: grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6
        working_dir: ${WORKSPACE_ROOT:?}
        environment:
            WORKSPACE_ROOT: ${WORKSPACE_ROOT:?}
        volumes: ['${WORKSPACE_ROOT:?}:${WORKSPACE_ROOT:?}']

networks:
    default:
        name: ${DEVCONTAINER_NETWORK:?}
        external: true
