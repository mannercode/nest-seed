x-api-base: &api-base
    env_file:
        - ../.env.infra
        - ../.env.api
    environment:
        # deploy 시에는 .env.api의 NODE_ENV=test와 LOG_DIRECTORY=./_output/logs를 덮어쓴다.
        # 비밀번호 암호화(bcrypt)와 파일 작업은 같은 작업 스레드를 사용한다.
        # 기본 4개로는 요청이 몰릴 때 부족하므로 16개로 늘린다.
        - NODE_ENV=production
        - UV_THREADPOOL_SIZE=16
        - LOG_DIRECTORY=/app/logs
    labels:
        co.elastic.logs/enabled: 'true'
        co.elastic.logs/json.add_error_key: 'true'
        co.elastic.logs/json.expand_keys: 'true'
        co.elastic.logs/json.overwrite_keys: 'true'
    logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
    healthcheck:
        retries: 5
        start_period: 10s
        interval: 10s
        timeout: 5s
        test: 'curl -fsS http://localhost:${API_PORT:?}/health'

services:
    api:
        <<: *api-base
        build:
            context: ..
            dockerfile: apps/api/Dockerfile
            args:
                DEPS_TAG: ${DEPS_TAG:?DEPS_TAG must be set}
        image: nest-seed-api
        # restart 정책은 일부러 두지 않는다.
        # 이 스택은 검증용이라, 복제본이 죽으면 자동 복구로 가려지지 않고 그대로 드러나야 한다.
        # replica-chaos 시나리오도 kill/start로 복제본 생명주기를 직접 다루므로 자동 재시작과 충돌한다.
        deploy:
            replicas: 4

    nginx:
        image: nginx:1.31.4-alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
        ports: ['127.0.0.1:3000:80']
        volumes: ['./nginx.conf:/etc/nginx/nginx.conf:ro']
        depends_on:
            api: { condition: service_healthy }
        labels:
            co.elastic.logs/enabled: 'true'
            co.elastic.logs/json.add_error_key: 'true'
            co.elastic.logs/json.expand_keys: 'true'
            co.elastic.logs/json.overwrite_keys: 'true'
        logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }
        healthcheck:
            # Alpine은 localhost를 ::1로 먼저 해석하지만 이 검증용 NGINX는 IPv4만 listen한다.
            test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/health >/dev/null']
            interval: 5s
            timeout: 3s
        restart: unless-stopped

    restate-register:
        profiles: [setup]
        image: nest-seed-api
        env_file:
            - ../.env.infra
        environment:
            RESTATE_DEPLOYMENT_URI: http://nginx:9080
        entrypoint: ['/bin/sh', '-ec']
        # Compose가 문자열 command를 단어별 argv로 나누지 않도록 shell 본문 하나로 넘긴다.
        command:
            - |
                curl -fsS "$$RESTATE_ADMIN_URL/health" >/dev/null
                curl -fsS \
                  -H 'content-type: application/json' \
                  --data "{\"uri\":\"$$RESTATE_DEPLOYMENT_URI\",\"force\":false,\"use_http_11\":false}" \
                  "$$RESTATE_ADMIN_URL/deployments"

networks:
    default:
        name: ${COMPOSE_PROJECT_NAME}
        external: true
