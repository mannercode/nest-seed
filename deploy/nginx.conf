worker_processes 8;
# 검증 스택의 동시 요청을 처리하되 과도한 프로세스 전환은 피하도록 작업 프로세스를 제한한다.

events {
    worker_connections 1024;
}

http {
    # 요청을 처리한 API 컨테이너와 응답 코드, 걸린 시간을 로그에 남긴다.
    # 502 오류가 나면 어느 컨테이너에서 문제가 났는지 확인할 수 있다.
    log_format upstreamlog '$remote_addr - - [$time_local] "$request" $status $body_bytes_sent '
                           'upstream=$upstream_addr u_status=$upstream_status '
                           'u_rt=$upstream_response_time rt=$request_time';
    access_log /dev/stdout upstreamlog;
    error_log  /dev/stderr warn;

    # 반복 구조가 많은 JSON의 전송량을 줄이되 CPU 부담을 제한하도록 중간 압축 수준을 사용한다.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types application/json;
    gzip_proxied any;
    gzip_vary on;

    # 본문 한도는 express의 HTTP_REQUEST_PAYLOAD_LIMIT(.env.api)와 같은 값으로 맞춘다.
    # 파일 업로드는 presigned URL로 스토리지에 직접 가므로 API가 받는 JSON 본문은 1m면 충분하다.
    client_max_body_size 1m;

    upstream api {
        least_conn;
        server api:3000;
        # 요청이 몰릴 때도 API 컨테이너 연결을 재사용할 수 있도록 여유 있는 풀을 둔다.
        keepalive 128;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # 큰 upstream 응답을 임시 파일로 넘기는 빈도를 줄이도록 proxy buffer를 넉넉히 둔다.
            proxy_buffers 16 8k;
            proxy_buffer_size 8k;
        }

        # 진행 상황을 계속 보내는 연결이다.
        # 작업 완료가 늦어질 수 있어 nginx의 대기 시간을 늘린다.
        # Node 서버의 연결 대기를 늘리면 종료가 늦어지므로 nginx 쪽만 조정한다.
        # 이벤트는 모아 두지 않고 바로 전달한다.
        location = /showtime-creation/event-stream {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        location /health {
            proxy_pass http://api/health;
        }
    }
}
