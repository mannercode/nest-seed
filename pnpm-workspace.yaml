packages:
    - 'apps/*'
    - 'libs/*'
    - 'infra/tests'
    - 'tests/*'
    - 'tools/*'

saveExact: true

# TypeScript는 별도 지시 전까지 현재 버전을 유지한다.
update:
    ignoreDeps:
        - typescript

allowBuilds:
    argon2: true
    cpu-features: false
    protobufjs: false
    ssh2: false
    unrs-resolver: true
