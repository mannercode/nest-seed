packages:
    - 'apps/*'
    - 'libs/*'
    - 'infra/tests'
    - 'tests/*'
    - 'tools/*'

saveExact: true

# TypeScript는 별도 지시 전까지 현재 버전을 유지한다.
update:
    ignoreDeps:
        - typescript

allowBuilds:
    'bcrypt@6.0.0': true
    cpu-features: false
    'fsevents@2.3.2': true
    'fsevents@2.3.3': true
    protobufjs: false
    ssh2: false
    'unrs-resolver@1.12.2': true

minimumReleaseAgeExclude:
    - '@aws-sdk/client-s3@3.1131.0'
    - '@aws-sdk/s3-presigned-post@3.1131.0'
    - '@aws-sdk/s3-request-presigner@3.1131.0'
    - '@nestjs/schematics@12.0.1'
    - '@next/env@16.3.5'
    - '@next/swc-darwin-arm64@16.3.5'
    - '@next/swc-darwin-x64@16.3.5'
    - '@next/swc-linux-arm64-gnu@16.3.5'
    - '@next/swc-linux-arm64-musl@16.3.5'
    - '@next/swc-linux-x64-gnu@16.3.5'
    - '@next/swc-linux-x64-musl@16.3.5'
    - '@next/swc-win32-arm64-msvc@16.3.5'
    - '@next/swc-win32-x64-msvc@16.3.5'
    - compression@1.8.2
    - lint-staged@17.5.1
    - next@16.3.5
    - zod@4.6.2
