packages:
    - 'apps/*'
    - 'libs/*'
    - 'infra/tests'
    - 'tests/*'
    - 'tools/*'

saveExact: true

# TypeScript는 별도 지시 전까지 현재 버전을 유지한다.
update:
    ignoreDeps:
        - typescript

allowBuilds:
    argon2: true
    # 테스트는 로컬 Docker 소켓과 Docker의 포트 매핑만 쓰므로 SSH용 CPU 감지·암호화 가속 모듈의 빌드를 생략한다.
    cpu-features: false
    ssh2: false
    # protobufjs의 postinstall은 상위 패키지의 의존성 버전 표기를 검사해 경고만 출력한다.
    protobufjs: false
