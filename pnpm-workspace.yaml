packages:
    - 'apps/*'
    - 'libs/*'
    - 'infra/tests'
    - 'tests/*'
    - 'tools'

saveExact: true

# TypeScript는 루트·API에서 6.x, 웹 앱·브라우저 테스트에서 7.x를 쓰므로 사용처별로 수동 갱신한다.
# 백엔드의 7.1 이상 전환 시 ts-loader가 Nest 생성자 타입(design:paramtypes)을 기록하고
# fork-ts-checker가 API 빌드에서 타입 오류를 검출해야 한다. https://github.com/TypeStrong/fork-ts-checker-webpack-plugin/pull/899
# Vitest 변환기는 컴파일러가 데코레이터 메타데이터에 추가한 분기만 커버리지에서 제외해야 한다. https://github.com/microsoft/TypeScript/issues/64861
update:
    ignoreDeps:
        - typescript

allowBuilds:
    argon2: true
    # 테스트는 로컬 Docker 소켓과 Docker의 포트 매핑만 쓰므로 SSH용 CPU 감지·암호화 가속 모듈의 빌드를 생략한다.
    cpu-features: false
    ssh2: false
    # protobufjs의 postinstall은 상위 패키지의 의존성 버전 표기를 검사해 경고만 출력한다.
    protobufjs: false
